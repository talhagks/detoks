<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Temiz YT</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #222;
    --accent: #ff3b3b;
    --text: #f5f5f5;
    --muted: #555;
    --card: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(16px);
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { color: var(--accent); }

  .video-count {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .video-count span { color: var(--text); font-weight: 500; }

  /* ADD BAR */
  .add-bar {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .url-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .url-input:focus { border-color: var(--accent); }
  .url-input::placeholder { color: var(--muted); }

  .title-input {
    width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .title-input:focus { border-color: var(--accent); }
  .title-input::placeholder { color: var(--muted); }

  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .add-btn:hover { opacity: 0.85; transform: scale(1.02); }
  .add-btn:active { transform: scale(0.98); }

  /* PLAYER */
  .player-wrap {
    display: none;
    padding: 24px 32px 0;
  }
  .player-wrap.show { display: block; }

  .player-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .now-playing {
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .close-player {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .close-player:hover { color: var(--text); border-color: var(--muted); }

  .player-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }

  .iframe-wrap {
    position: relative;
    padding-bottom: 56.25%;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
  }
  .iframe-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* LIST */
  .list-wrap {
    padding: 24px 32px;
  }

  .list-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; line-height: 1.6; }

  .video-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .video-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .video-item:hover { border-color: var(--accent); background: #1e1010; }
  .video-item.playing { border-color: var(--accent); background: #1e1010; }

  .video-thumb {
    width: 100px;
    height: 56px;
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .thumb-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: #1a1a1a;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 8px;
  }
  .video-item:hover .play-overlay { opacity: 1; }
  .play-icon { font-size: 20px; }

  .video-info { flex: 1; min-width: 0; }
  .video-name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .video-url {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playing-badge {
    display: none;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 50px;
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .video-item.playing .playing-badge { display: block; }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--accent); background: rgba(255,59,59,0.1); }

  /* ERROR */
  .error-msg {
    display: none;
    color: var(--accent);
    font-size: 13px;
    margin-top: 8px;
    padding-left: 4px;
  }
  .error-msg.show { display: block; }

  @media (max-width: 600px) {
    header { padding: 16px 20px; }
    .add-bar { padding: 16px 20px; flex-wrap: wrap; }
    .title-input { width: 100%; }
    .player-wrap, .list-wrap { padding: 16px 20px; }
    .video-thumb { width: 72px; height: 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">TEMİZ<span class="logo-dot">YT</span></div>
  <div class="video-count"><span id="countNum">0</span> video</div>
</header>

<div class="add-bar">
  <input class="url-input" id="urlInput" placeholder="YouTube URL yapıştır (youtube.com/watch?v=... veya youtu.be/...)" onkeydown="if(event.key==='Enter') addVideo()">
  <input class="title-input" id="titleInput" placeholder="Video adı (isteğe bağlı)" onkeydown="if(event.key==='Enter') addVideo()">
  <button class="add-btn" onclick="addVideo()">+ Ekle</button>
</div>
<div class="error-msg" id="errorMsg">Geçerli bir YouTube URL'si gir!</div>

<!-- PLAYER -->
<div class="player-wrap" id="playerWrap">
  <div class="player-header">
    <div class="now-playing">▶ Şu An Oynatılıyor</div>
    <button class="close-player" onclick="closePlayer()">✕ Kapat</button>
  </div>
  <div class="player-title" id="playerTitle"></div>
  <div class="iframe-wrap">
    <iframe id="ytFrame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>
</div>

<!-- LIST -->
<div class="list-wrap">
  <div class="list-title">Video Listem</div>
  <div id="emptyState" class="empty-state">
    <div class="empty-icon">🎬</div>
    <div class="empty-text">Henüz video yok.<br>YouTube'dan bir video URL'si yapıştır ve ekle.</div>
  </div>
  <div class="video-list" id="videoList"></div>
</div>

<script>
let videos = JSON.parse(localStorage.getItem('temizyt_videos') || '[]');
let currentIdx = -1;

function extractVideoId(url) {
  url = url.trim();
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  // bare ID
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

function addVideo() {
  const url = document.getElementById('urlInput').value.trim();
  const title = document.getElementById('titleInput').value.trim();
  const err = document.getElementById('errorMsg');

  const id = extractVideoId(url);
  if (!id) {
    err.classList.add('show');
    setTimeout(() => err.classList.remove('show'), 3000);
    return;
  }
  err.classList.remove('show');

  const name = title || 'Video ' + (videos.length + 1);
  videos.push({ id, name, url });
  save();
  document.getElementById('urlInput').value = '';
  document.getElementById('titleInput').value = '';
  render();
}

function playVideo(idx) {
  currentIdx = idx;
  const v = videos[idx];
  document.getElementById('playerTitle').textContent = v.name;
  document.getElementById('ytFrame').src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3`;
  document.getElementById('playerWrap').classList.add('show');
  document.getElementById('playerWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
  render();
}

function closePlayer() {
  document.getElementById('ytFrame').src = '';
  document.getElementById('playerWrap').classList.remove('show');
  currentIdx = -1;
  render();
}

function deleteVideo(idx, e) {
  e.stopPropagation();
  if (currentIdx === idx) closePlayer();
  videos.splice(idx, 1);
  if (currentIdx > idx) currentIdx--;
  save();
  render();
}

function save() {
  localStorage.setItem('temizyt_videos', JSON.stringify(videos));
}

function render() {
  document.getElementById('countNum').textContent = videos.length;
  const empty = document.getElementById('emptyState');
  const list = document.getElementById('videoList');

  if (videos.length === 0) {
    empty.style.display = 'block';
    list.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = videos.map((v, i) => `
    <div class="video-item ${i === currentIdx ? 'playing' : ''}" onclick="playVideo(${i})">
      <div class="video-thumb">
        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="">
        <div class="thumb-placeholder" style="display:none;">▶</div>
        <div class="play-overlay"><span class="play-icon">▶</span></div>
      </div>
      <div class="video-info">
        <div class="video-name">${v.name}</div>
        <div class="video-url">youtu.be/${v.id}</div>
      </div>
      <div class="playing-badge">OYNATILIYOR</div>
      <button class="delete-btn" onclick="deleteVideo(${i}, event)" title="Sil">×</button>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
